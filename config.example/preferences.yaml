domain:
  # At least one of these must appear in title OR body.
  must_include_any:
    - cloud
    - developer experience
    - developer productivity
    - devex
    - devops
    - engineering operations
    - infrastructure
    - platform
    - production engineering
    - site reliability
    - sre
    - technical operations

location:
  # A job passes if it is remote-eligible OR its location text matches one of these.
  allow_remote: true
  accept_any:
    - " wa "
    - bellevue
    - bothell
    - everett
    - kirkland
    - lynnwood
    - pacific northwest
    - redmond
    - "remote (us)"
    - "remote - us"
    - seattle
    - "united states"
    - "us-remote"
    - "usa"
    - "wa,"
    - "washington"
  # Roles explicitly NOT remote (on-site or hybrid) are checked against this list instead of
  # accept_any (e.g. "united states" alone doesn't make an on-site New York role commutable).
  # Leave empty to turn this off.
  onsite_accept_any:
    - " wa "
    - bellevue
    - bothell
    - everett
    - kirkland
    - lynnwood
    - pacific northwest
    - redmond
    - renton
    - seattle
    - tacoma
    - "wa,"
  # Many postings don't say whether they're remote. With this on, such a role is checked against
  # onsite_accept_any (like an on-site one) when neither its title, location nor text mentions
  # remote work ("remote", "remotely", "work from home", "telecommute"; in the location also
  # "home", "home based", "offsite" or "virtual"): "New York, NY, United States" names where the
  # job is, so "united states" in accept_any isn't enough. A location that is only a country
  # (exactly one of country_wide_any) is left to accept_any. With allow_remote false the rule
  # still applies, but mentioning remote work no longer exempts a role. Needs onsite_accept_any;
  # false (the default) turns this off.
  unknown_remote_is_onsite: true
  country_wide_any:
    - "united states"
    - "united states of america"
    - "us"
    - "usa"
  # Remote roles whose text names one of these are rejected (foreign-only remote).
  reject_any:
    - "canada only"
    - "emea only"
    - "india"
    - "remote - europe"
    - "remote - uk"

scoring:
  # Only roles scoring at or above this get a generated letter.
  min_score_for_letter: 7
