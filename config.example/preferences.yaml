# EXAMPLE preferences, copied to config/preferences.yaml by setup. They are tuned for a
# Director/VP engineering-leadership search around Seattle: change every list to fit yours.
#
# Hard filters applied before any LLM call. Cheap, deterministic, and testable.
#
# A job must pass EVERY section to be scored. Matching is case-insensitive and by whole word or
# phrase: "intern" finds "Intern" and "Interns" but not "Internal". End a term with * to match
# any ending: "recruit*" finds "Recruiting" and "Recruiter".

