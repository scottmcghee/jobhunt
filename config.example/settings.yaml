# Tunable settings for jobhunt. Every key is optional, and every value below is the built-in
# default, so this whole file can be deleted (or left as is) without changing anything.
#
# Precedence, highest first: a CLI flag (where one exists) > an environment variable
# JOBHUNT_<SECTION>_<KEY> > this file > the built-in default.
# Example: JOBHUNT_FETCH_WORKERS=16 jobhunt fetch
#
# Search preferences (titles, domains, locations, the letter threshold) live in preferences.yaml.

llm:
  # anthropic | claude-code | bedrock. null: auto (anthropic if ANTHROPIC_API_KEY is set, else
  # claude-code if `claude` is on PATH). Bedrock is only ever chosen explicitly.
  # Env: JOBHUNT_LLM_BACKEND, or the older JOBHUNT_BACKEND
  backend: null
  # null: the backend's own default (claude-sonnet-5-5; `sonnet` for claude-code;
  # anthropic.claude-sonnet-5-5 for Bedrock). Env: JOBHUNT_LLM_MODEL, or the older JOBHUNT_MODEL
  model: null
  claude_code_timeout: 180  # seconds per `claude -p` call. Env: JOBHUNT_LLM_CLAUDE_CODE_TIMEOUT
  score_max_tokens: 1600  # Env: JOBHUNT_LLM_SCORE_MAX_TOKENS
  letter_max_tokens: 800  # Env: JOBHUNT_LLM_LETTER_MAX_TOKENS
  body_chars: 12000  # characters of a posting sent to the model. Env: JOBHUNT_LLM_BODY_CHARS

fetch:
  workers: 32  # requests in flight across all hosts (`fetch --workers`). Env: JOBHUNT_FETCH_WORKERS
  # Most requests in flight per Workday datacenter or API host (`fetch --per-host`).
  # Env: JOBHUNT_FETCH_PER_HOST
  per_host: 6
  start_per_host: 2  # where each host's adaptive limit starts. Env: JOBHUNT_FETCH_START_PER_HOST
  timeout: 20  # seconds per request. Env: JOBHUNT_FETCH_TIMEOUT
  user_agent: "jobhunt/0.1 (+personal job search tool)"  # Env: JOBHUNT_FETCH_USER_AGENT
  max_retries: 3  # retries on 429, or 503 with Retry-After. Env: JOBHUNT_FETCH_MAX_RETRIES
  # A Retry-After longer than this (seconds) skips the board for this run instead of waiting.
  # Env: JOBHUNT_FETCH_MAX_RETRY_AFTER
  max_retry_after: 120
  cooldown: 5  # seconds between two halvings of a host's limit. Env: JOBHUNT_FETCH_COOLDOWN
  # Refusals (429, or a 403 block page) in a row before a host's other boards are skipped.
  # Env: JOBHUNT_FETCH_BREAKER
  breaker: 5
  # Fetches in a row that find a board gone before it is removed from companies.yaml: an HTTP
  # 404, or for Workday a 422 (site removed) or a 403 "S22" (site closed).
  # Env: JOBHUNT_FETCH_PRUNE_AFTER_404S
  prune_after_404s: 3
  # Retries, after a 1 s then 2 s wait, on a 500/502/504, a connection error (e.g. a failed DNS
  # lookup) or a timeout, before the board is skipped for this run.
  # Env: JOBHUNT_FETCH_TRANSIENT_RETRIES
  transient_retries: 2
  # Most requests sent per second for a rate group; groups not listed have no cap, except iCIMS
  # Career Sites (0.2/s, from their robots.txt crawl delay; an entry for the host overrides it). Keys are the
  # group names `fetch -v` prints in its stats (workable, lever, bamboohr, "workday:wd5"), and are
  # case-sensitive; *.eightfold.ai boards share "eightfold", an Eightfold board on its own host
  # has that host, and an Oracle board its tenant host (e.g. eeho.fa.us2.oraclecloud.com). Workable's Cloudflare bans an IP for a
  # minute or so after a burst of about 50 requests in 10 s. Setting the map (here or in
  # the environment) replaces it whole, so keep workable, eightfold, apply.careers.microsoft.com
  # and apple in it to keep their caps; {} removes every configured cap (an iCIMS site keeps its
  # built-in 0.2/s unless its host gets its own entry). Env: JOBHUNT_FETCH_MAX_RATE as
  # JSON, e.g. '{"workable": 3, "eightfold": 2, "apply.careers.microsoft.com": 0.5, "apple": 1}'
  # Microsoft's careers site (Eightfold) answered 429 to requests one second apart.
  max_rate:
    # Cloudflare 429s a steady ~1.9/s after 900-1,250 requests; 2827 boards at 1.4/s is ~34 min
    workable: 1.4
    eightfold: 2.0  # every *.eightfold.ai board; 20 fetched side by side were answered 405
    apply.careers.microsoft.com: 0.5
    apple: 1.0  # each Apple search or job page is a ~300 KB server-rendered page
  # Most postings each search term may bring in, per search source. A term with more hits stops
  # there and fetch warns ("... has N hits; kept the first M"); raise a cap to take everything.
  # Amazon can't page past 9,900. Setting the map replaces it whole, so keep every source in it.
  # Env: JOBHUNT_FETCH_MAX_PER_TERM as JSON, e.g. '{"amazon": 9900, "apple": 2000}'
  max_per_term:
    amazon: 2000  # 100 a page
    apple: 400  # 20 a page
    eightfold: 500  # 10 a page
    oracle: 1000  # 200 a page
    phenom: 500  # 100 a page
    usajobs: 2000  # 500 a page

paths:
  # ~ expands, and a relative path is under the repo (like the defaults), whatever directory
  # you run from. The --data-dir and --output-dir flags are relative to the current directory.
  data_dir: null  # null: the repo's data/ (`--data-dir`). Env: JOBHUNT_PATHS_DATA_DIR
  output_dir: null  # null: the repo's output/ (`--output-dir`). Env: JOBHUNT_PATHS_OUTPUT_DIR

slugs:
  # Threads for `python -m jobhunt.slugs --check`. Env: JOBHUNT_SLUGS_CHECK_WORKERS
  check_workers: 4
  # Boards between --check's progress lines (slugs and discover).
  # Env: JOBHUNT_SLUGS_CHECK_PROGRESS_EVERY
  check_progress_every: 50

discover:
  # `python -m jobhunt.discover`: a careers host that failed for now (no answer, 5xx or 429) is
  # surveyed again on a later run, at least retry_after_hours after its last try, max_attempts
  # times in all; `--refresh` surveys every host again. max_attempts also caps the S&P 500
  # survey's tries of a company that stays unreachable (scripts/survey_careers.py).
  max_attempts: 3  # Env: JOBHUNT_DISCOVER_MAX_ATTEMPTS
  retry_after_hours: 24.0  # Env: JOBHUNT_DISCOVER_RETRY_AFTER_HOURS
  # Careers hosts surveyed at once; each host still gets one request at a time, --delay apart.
  survey_workers: 8  # Env: JOBHUNT_DISCOVER_SURVEY_WORKERS
  # --webgraph keeps hosts whose first label is one of these (careers.acme.com) and whose
  # top-level domain is generic (anything but a two-letter country code) or one of
  # webgraph_country_tlds. In the environment, a list is comma-separated or JSON.
  webgraph_labels: [careers, jobs, career, job, talent, recruiting, hiring]  # Env: JOBHUNT_DISCOVER_WEBGRAPH_LABELS
  webgraph_country_tlds: [us, io, co, ai]  # Env: JOBHUNT_DISCOVER_WEBGRAPH_COUNTRY_TLDS

usajobs:
  # The federal jobs source (`ats: usajobs`) needs a free API key from developer.usajobs.gov and
  # the email address it was requested with; USAJOBS wants that email as each request's
  # User-Agent. Both are secrets of a sort: keep them here (config/ is gitignored) or in the
  # environment. null: USAJOBS boards are skipped with a warning.
  api_key: null  # Env: JOBHUNT_USAJOBS_API_KEY
  email: null  # Env: JOBHUNT_USAJOBS_EMAIL
