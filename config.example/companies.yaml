# Companies to watch. EXAMPLE list: replace it with the boards you care about.
#
# Each entry: a display name, the ATS it uses, and the board slug used in that ATS's public API.
#
# How to find the slug:
#   Greenhouse: careers page URL like boards.greenhouse.io/<slug>  or  job-boards.greenhouse.io/<slug>
#               API: https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
#   Lever:      jobs.lever.co/<slug>
#               API: https://api.lever.co/v0/postings/<slug>?mode=json
#   Ashby:      jobs.ashbyhq.com/<slug>
#               API: https://api.ashbyhq.com/posting-api/job-board/<slug>
#   Workday:    <tenant>.<datacenter>.myworkdayjobs.com/[en-US/]<site>
#               slug is tenant/site, plus a datacenter line, e.g. for adobe.wd5.myworkdayjobs.com/external_experienced:
#                 slug: adobe/external_experienced
#                 datacenter: wd5
#   SmartRecruiters: jobs.smartrecruiters.com/<identifier>/...  or  careers.smartrecruiters.com/<identifier>
#               API: https://api.smartrecruiters.com/v1/companies/<identifier>/postings
#               An unknown identifier returns no postings rather than a 404, so it is never removed
#               automatically; fetch warns about any SmartRecruiters board with no postings.
#   Workable:   apply.workable.com/<account>  (older: <account>.workable.com/jobs/...)
#               API: https://apply.workable.com/api/v1/widget/accounts/<account>?details=true
#   BambooHR:   <tenant>.bamboohr.com/careers
#               API: https://<tenant>.bamboohr.com/careers/list, then /careers/<id>/detail
#               An unknown tenant redirects to bamboohr.com; that counts like a 404.
#   SuccessFactors: a Career Site Builder site, e.g. jobs.<company>.com/job/<title>/<id>/ (its pages
#               load /platform/js/j2w/). slug is that host. Read from /sitemap.xml and the job
#               pages, within robots.txt.
#   Radancy:    a careers site with job URLs like <host>/job/<city>/<title>/<org>/<id> (its pages
#               load tbcdn.talentbrew.com). slug is that host. Read from its sitemaps and job pages.
#   Paradox:    a Paradox careers site, with job URLs like <host>/en/jobs/<id>/<title>/ or
#               <host>/<title>/job/<id>. slug is that host. Read like Radancy. (Many sites only
#               embed Paradox's chat assistant; their boards are on whatever ATS they use.)
#               Radancy and Paradox sites often front Workday: if a posting's apply link goes to
#               an ATS listed here, add that board instead, not both.
#   Eightfold:  <tenant>.eightfold.ai/careers, or a company's own host (Microsoft's is
#               apply.careers.microsoft.com). slug is that host. Optional location: limits its
#               searches to one place, e.g. "United States". Searched like Amazon (below).
#   Oracle:     <host>.oraclecloud.com/hcmUI/CandidateExperience/<lang>/sites/<site>/...
#               slug is host/site, e.g. eabc.fa.us2.oraclecloud.com/CX_1. Searched like Amazon
#               (below). The site only shapes job URLs: the search returns the host's postings
#               whatever the site, so list one board per host (fetch warns about more).
#   Apple:      jobs.apple.com, its own site. slug is the location filter from a search URL, e.g.
#               united-states-USA (jobs.apple.com/en-us/search?location=united-states-USA).
#               Searched like Amazon (below). A wrong location filter finds nothing rather than a
#               404, so the board is never removed; fetch warns about it instead.
#   Phenom:     a careers site in front of an ATS, e.g. careers.<company>.com/us/en/... (its pages
#               load cdn.phenompeople.com). slug is host/country/language, e.g.
#               careers.example.com/us/en, or just the host if its URLs have no /us/en. Searched
#               like Amazon (below). Its postings' apply links name the ATS behind it: if that's
#               one listed here (often Workday), add that board instead, not both.
#   Amazon:     amazon.jobs has its own search, not an ATS. slug is the country to search (ISO
#               alpha-3, e.g. USA). fetch searches once per word in preferences.yaml title.must_include_any,
#               plus any title.include_for_tags words for the board's tags.
#               Amazon matches whole words only: a wildcard term like "recruit*" searches just
#               "recruit" (fetch warns), so list "recruiter" and the other endings you want.
#               A wrong country code finds nothing rather than a 404, so the board is never
#               removed; fetch warns about it instead. Each term keeps its first postings in
#               Amazon's "recent" order (not strictly by posting date), up to the source's
#               fetch.max_per_term in settings.yaml (default 2,000).
#
# To find many slugs at once, see `python -m jobhunt.slugs --help`: it finds board URLs in any text
# file, such as lines grepped from Common Crawl index files. Add --check to drop boards that have
# no open postings.
#
# Verify a slug with `jobhunt fetch --company <name> --dry-run`. A board that returns 404 on three
# fetches in a row is removed from this file automatically.

