[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Ingest, filter, score, and tailor cover letters for job postings from public ATS APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scott McGhee" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# AWS credential-chain signing for JOBHUNT_BACKEND=bedrock (a Bedrock API key needs nothing extra)
bedrock = ["anthropic[bedrock]>=1.11"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff==0.16.10",  # pinned so local runs and CI agree; bump deliberately
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
